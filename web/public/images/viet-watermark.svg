<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" fill="none">
  <!-- Saigon Culinary Ingredients & Coastal Botanical Watermark Pattern (Opacity 6-8%) -->
  <g stroke="#14212d" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" opacity="0.07">
    
    <!-- 1. Star Anise (Hoa Hồi) - Top Left (x: 140, y: 150) -->
    <g transform="translate(140, 150) scale(0.9)">
      <circle cx="0" cy="0" r="10" stroke-dasharray="2 3"/>
      <!-- 8 carpels -->
      <path d="M 0,-10 C -12,-35 -14,-55 0,-65 C 14,-55 12,-35 0,-10 Z" />
      <circle cx="0" cy="-45" r="4"/>
      
      <path d="M 7,-7 C 32,-28 48,-36 60,-25 C 52,-11 32,5 7,7 Z" transform="rotate(45)" />
      <circle cx="0" cy="-45" r="4" transform="rotate(45)"/>
      
      <path d="M 10,0 C 35,-12 55,-14 65,0 C 55,14 35,12 10,0 Z" />
      <circle cx="45" cy="0" r="4"/>
      
      <path d="M 7,7 C 28,32 36,48 25,60 C 11,52 -5,32 -7,7 Z" transform="rotate(45)"/>
      <circle cx="0" cy="45" r="4" transform="rotate(45)"/>
      
      <path d="M 0,10 C -12,35 -14,55 0,65 C 14,55 12,35 0,10 Z" />
      <circle cx="0" cy="45" r="4"/>
      
      <path d="M -7,7 C -32,28 -48,36 -60,25 C -52,11 -32,-5 -7,-7 Z" transform="rotate(45)"/>
      <circle cx="0" cy="-45" r="4" transform="rotate(225)"/>
      
      <path d="M -10,0 C -35,-12 -55,-14 -65,0 C -55,14 -35,12 -10,0 Z" />
      <circle cx="-45" cy="0" r="4"/>
      
      <path d="M -7,-7 C -28,-32 -36,-48 -25,-60 C -11,-52 5,-32 7,-7 Z" transform="rotate(45)"/>
      <circle cx="0" cy="45" r="4" transform="rotate(225)"/>
      
      <!-- Hatching details -->
      <path d="M -2,-25 L 2,-25 M -3,-35 L 3,-35 M -25,-2 L -25,2 M -35,-3 L -35,3"/>
    </g>

    <!-- 2. Steaming Pho Bowl with Chopsticks (Tô Phở & Đũa) - Top Right (x: 780, y: 180) -->
    <g transform="translate(780, 180) scale(0.95)">
      <!-- Bowl rim and body -->
      <ellipse cx="0" cy="0" rx="75" ry="24" />
      <ellipse cx="0" cy="0" rx="68" ry="20" stroke-dasharray="4 2"/>
      <path d="M -75,0 C -70,55 -38,80 0,82 C 38,80 70,55 75,0" />
      <!-- Bowl foot -->
      <path d="M -30,80 C -30,92 -20,95 0,95 C 20,95 30,92 30,80" />
      <!-- Broth surface & noodles -->
      <path d="M -50,-2 Q -20,10 10,-3 Q 40,-8 58,2" />
      <path d="M -42,5 Q -10,18 25,6 Q 45,2 50,8" />
      <path d="M -35,12 Q 0,22 35,12" />
      <!-- Herb garnish on top -->
      <path d="M -15,-6 C -20,-16 -8,-20 0,-12 C 8,-20 20,-16 15,-6 Z" />
      <!-- Steam curls -->
      <path d="M -30,-30 C -40,-50 -20,-65 -25,-85" />
      <path d="M 0,-35 C -10,-58 12,-72 5,-98" />
      <path d="M 30,-28 C 20,-48 40,-62 35,-82" />
      <!-- Chopsticks resting across -->
      <path d="M -85,-15 L 90,-45 M -82,-10 L 92,-40" />
    </g>

    <!-- 3. Coriander / Sawtooth Herb Sprig (Cọng Ngò Gai & Rau Thơm) - Middle Left (x: 120, y: 520) -->
    <g transform="translate(120, 520) rotate(-25) scale(0.9)">
      <!-- Main stem -->
      <path d="M 0,110 C 10,60 5,0 -20,-80" stroke-width="1.6"/>
      <!-- Sawtooth leaf left 1 -->
      <path d="M 3,80 C -25,70 -50,60 -65,35 C -45,45 -20,62 3,70" />
      <path d="M -65,35 L -60,40 L -52,33 L -48,42 L -38,36" stroke-width="0.8"/>
      <!-- Sawtooth leaf right 1 -->
      <path d="M 5,60 C 35,50 65,45 80,15 C 60,30 30,45 5,52" />
      <path d="M 80,15 L 72,22 L 68,14 L 58,23" stroke-width="0.8"/>
      <!-- Leaf left 2 -->
      <path d="M 2,30 C -25,20 -55,10 -70,-20 C -50,-8 -25,12 2,22" />
      <!-- Leaf right 2 -->
      <path d="M -2,0 C 25,-12 55,-25 70,-60 C 50,-40 25,-20 -2,-8" />
      <!-- Terminal tip leaves -->
      <path d="M -15,-60 C -30,-90 -20,-120 -20,-130 C -10,-115 0,-95 -12,-75" />
      <path d="M -15,-60 C 10,-85 15,-110 10,-125 C 0,-105 -5,-85 -18,-72" />
    </g>

    <!-- 4. Sliced Citrus / Lemon Wheel (Lát Chanh Sài Gòn) - Center (x: 480, y: 440) -->
    <g transform="translate(480, 440) scale(0.85)">
      <!-- Outer rind -->
      <circle cx="0" cy="0" r="62" />
      <circle cx="0" cy="0" r="56" stroke-dasharray="3 2"/>
      <circle cx="0" cy="0" r="10" />
      <!-- Citrus pulp segments -->
      <path d="M 7,12 C 18,24 28,38 32,44 C 22,48 10,48 0,47 C 3,36 5,24 7,12 Z" />
      <path d="M 12,-7 C 24,-18 38,-28 44,-32 C 48,-22 48,-10 47,0 C 36,-3 24,-5 12,-7 Z" />
      <path d="M -7,-12 C -18,-24 -28,-38 -32,-44 C -22,-48 -10,-48 0,-47 C -3,-36 -5,-24 -7,-12 Z" />
      <path d="M -12,7 C -24,18 -38,28 -44,32 C -48,22 -48,10 -47,0 C -36,3 -24,5 -12,7 Z" />
      <path d="M 12,7 C 28,15 40,24 46,28 C 42,36 34,42 26,46 C 20,38 15,24 12,7 Z" />
      <path d="M -7,12 C -15,28 -24,40 -28,46 C -36,42 -42,34 -46,26 C -38,20 -24,15 -7,12 Z" />
      <path d="M -12,-7 C -28,-15 -40,-24 -46,-28 C -42,-36 -34,-42 -26,-46 C -20,-38 -15,-24 -12,-7 Z" />
      <path d="M 7,-12 C 15,-28 24,-40 28,-46 C 36,-42 42,-34 46,-26 C 38,-20 24,-15 7,-12 Z" />
    </g>

    <!-- 5. Fresh Squid & Seafood Tentacles (Mực / Bạch Tuộc Nướng) - Middle Right (x: 820, y: 560) -->
    <g transform="translate(820, 560) scale(0.9)">
      <!-- Squid mantle -->
      <path d="M 0,-85 C -25,-60 -35,-20 -28,30 L 28,30 C 35,-20 25,-60 0,-85 Z" />
      <!-- Fins -->
      <path d="M -15,-70 C -45,-55 -55,-35 -25,-30" />
      <path d="M 15,-70 C 45,-55 55,-35 25,-30" />
      <!-- Eyes & collar -->
      <ellipse cx="-12" cy="35" rx="5" ry="3"/>
      <ellipse cx="12" cy="35" rx="5" ry="3"/>
      <!-- Tentacles curling gracefully -->
      <path d="M -22,42 C -35,65 -50,90 -45,115 C -40,135 -20,130 -25,105 C -30,85 -18,65 -15,45" />
      <path d="M -8,45 C -12,75 -15,110 -5,135 C 5,150 15,140 10,115 C 5,90 2,70 0,46" />
      <path d="M 8,45 C 18,70 25,100 40,125 C 50,140 60,128 50,108 C 40,88 28,68 18,46" />
      <path d="M 22,42 C 38,62 55,85 68,105 C 78,120 85,110 75,95 C 62,78 45,58 26,44" />
      <!-- Suckers -->
      <circle cx="-38" cy="100" r="3"/>
      <circle cx="-32" cy="118" r="3"/>
      <circle cx="28" cy="105" r="3"/>
      <circle cx="48" cy="115" r="3"/>
    </g>

    <!-- 6. Cinnamon Bark & Sliced Chili Peppers (Quế & Ớt Sừng) - Bottom Left (x: 220, y: 820) -->
    <g transform="translate(220, 820) scale(0.9)">
      <!-- Cinnamon stick 1 -->
      <path d="M -50,-30 L 30,50 C 38,58 48,52 42,44 L -38,-36 C -46,-44 -56,-38 -50,-30 Z" />
      <ellipse cx="-44" cy="-33" rx="7" ry="12" transform="rotate(-45 -44 -33)"/>
      <path d="M -40,-25 L 35,50 M -35,-20 L 38,53" stroke-dasharray="6 4" stroke-width="0.9"/>
      <!-- Sliced Red Chili Pepper -->
      <path d="M 10,-60 C 35,-40 65,-10 60,30 C 58,45 50,55 45,45 C 50,20 28,-15 5,-40 Z" />
      <path d="M 8,-62 C 5,-72 15,-75 18,-65" />
      <!-- Diagonal slice of chili with seeds -->
      <ellipse cx="-15" cy="20" rx="14" ry="8" transform="rotate(-30 -15 20)"/>
      <ellipse cx="-15" cy="20" rx="9" ry="5" transform="rotate(-30 -15 20)"/>
      <circle cx="-17" cy="20" r="1.8"/>
      <circle cx="-13" cy="21" r="1.8"/>
    </g>

    <!-- 7. Fish Sketch (Appetito style Sea Fish) - Bottom Right (x: 750, y: 840) -->
    <g transform="translate(750, 840) scale(0.95)">
      <!-- Fish contour -->
      <path d="M -90,0 C -60,-35 20,-40 70,-10 C 95,-30 115,-35 125,-25 C 115,0 115,0 125,25 C 115,35 95,30 70,10 C 20,40 -60,35 -90,0 Z" />
      <!-- Head line and gills -->
      <path d="M -45,-30 C -35,-10 -35,10 -45,30" />
      <path d="M -38,-20 C -30,-5 -30,5 -38,20" stroke-width="0.9"/>
      <!-- Eye -->
      <circle cx="-65" cy="-6" r="6"/>
      <circle cx="-65" cy="-6" r="2.5" fill="#14212d" opacity="0.15"/>
      <!-- Mouth -->
      <path d="M -90,0 L -80,4" />
      <!-- Dorsal & pectoral fins -->
      <path d="M -10,-35 C 10,-50 45,-45 55,-25" />
      <path d="M -30,10 C -15,12 -5,22 -15,30 Z" />
      <path d="M 15,30 C 35,42 50,35 55,20" />
      <!-- Scales hatching -->
      <path d="M -20,-15 C -15,-8 -15,0 -20,8 M -5,-18 C 0,-10 0,2 -5,12 M 10,-15 C 15,-8 15,0 10,8 M 25,-12 C 30,-5 30,2 25,10" stroke-dasharray="3 3"/>
    </g>

    <!-- 8. Whole Garlic Bulb & Cloves - Bottom Center (x: 480, y: 880) -->
    <g transform="translate(480, 880) scale(0.75)">
      <path d="M 0,-45 C 5,-25 35,-15 35,15 C 35,38 18,48 0,48 C -18,48 -35,38 -35,15 C -35,-15 -5,-25 0,-45 Z" />
      <path d="M 0,-45 C 0,-15 15,10 15,46" />
      <path d="M 0,-45 C 0,-15 -15,10 -15,46" />
      <!-- Roots -->
      <path d="M -12,48 L -15,58 M -4,48 L -4,60 M 4,48 L 4,60 M 12,48 L 15,58" />
    </g>

    <!-- 9. Floating Star Anise & Herb accents for tiling fluidity -->
    <g transform="translate(480, 80) scale(0.55)">
      <circle cx="0" cy="0" r="6"/>
      <path d="M 0,-6 C -8,-22 -9,-36 0,-42 C 9,-36 8,-22 0,-6 Z"/>
      <path d="M 6,0 C 22,-8 36,-9 42,0 C 36,9 22,8 6,0 Z"/>
      <path d="M 0,6 C -8,22 -9,36 0,42 C 9,36 8,22 0,6 Z"/>
      <path d="M -6,0 C -22,-8 -36,-9 -42,0 C -36,9 -22,8 -6,0 Z"/>
    </g>
    <g transform="translate(930, 400) scale(0.6) rotate(35)">
      <circle cx="0" cy="0" r="6"/>
      <path d="M 0,-6 C -8,-22 -9,-36 0,-42 C 9,-36 8,-22 0,-6 Z"/>
      <path d="M 6,0 C 22,-8 36,-9 42,0 C 36,9 22,8 6,0 Z"/>
      <path d="M 0,6 C -8,22 -9,36 0,42 C 9,36 8,22 0,6 Z"/>
      <path d="M -6,0 C -22,-8 -36,-9 -42,0 C -36,9 -22,8 -6,0 Z"/>
    </g>
    <g transform="translate(60, 920) scale(0.55) rotate(-20)">
      <circle cx="0" cy="0" r="6"/>
      <path d="M 0,-6 C -8,-22 -9,-36 0,-42 C 9,-36 8,-22 0,-6 Z"/>
      <path d="M 6,0 C 22,-8 36,-9 42,0 C 36,9 22,8 6,0 Z"/>
      <path d="M 0,6 C -8,22 -9,36 0,42 C 9,36 8,22 0,6 Z"/>
      <path d="M -6,0 C -22,-8 -36,-9 -42,0 C -36,9 -22,8 -6,0 Z"/>
    </g>
  </g>
</svg>

